<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #clock-container {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #clock-text {
    font-family: sans-serif;
    font-size: 10vw;
    color: #ffffff;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="clock-container">
  <div id="clock-text"></div>
</div>
<script src="clock-runtime.js"></script>
<script>
  let currentInterval = null;
  window.updatePreview = function (config, overrides) {
    if (currentInterval) {
      clearInterval(currentInterval);
    }
    currentInterval = bootClock(config, overrides || {});
  };
</script>
</body>
</html>
